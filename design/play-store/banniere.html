<canvas id="c" width="1024" height="500"></canvas>
<script>
const MARINE = '#01154B', OR = '#FBB900';

function dessiner(logo) {
  const c = document.getElementById('c'), x = c.getContext('2d');

  x.fillStyle = MARINE;
  x.fillRect(0, 0, 1024, 500);

  // Un seul accent : une diagonale d'or très pâle dans l'angle bas-droit,
  // pour que le bloc ne soit pas une simple plaque de couleur. Assez faible
  // pour ne jamais concurrencer le texte.
  x.save();
  x.beginPath();
  x.moveTo(1024, 205); x.lineTo(1024, 500); x.lineTo(836, 500);
  x.closePath();
  x.fillStyle = 'rgba(251,185,0,.055)';
  x.fill();
  x.restore();

  // Logo à gauche : même marine que le fond, la bordure ne se voit pas.
  x.drawImage(logo, 62, 118, 264, 264);

  x.textBaseline = 'alphabetic';

  x.fillStyle = '#FFFFFF';
  x.font = '800 94px PJS';
  x.fillText('SaamBiz', 384, 232);

  x.fillStyle = OR;
  x.font = '800 33px PJS';
  x.fillText('La marketplace sénégalaise', 388, 288);

  x.fillStyle = 'rgba(255,255,255,.80)';
  x.font = '500 28px PJS';
  x.fillText('Achetez près de chez vous.', 388, 341);
  x.fillText('Vendez sans ouvrir de boutique.', 388, 381);

  window.__png = c.toDataURL('image/png');
  window.__pret = true;
}

const img = new Image();
img.onload = async () => {
  await Promise.all([
    document.fonts.load('800 94px PJS'),
    document.fonts.load('800 33px PJS'),
    document.fonts.load('500 28px PJS'),
  ]);
  await document.fonts.ready;
